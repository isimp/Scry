name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # lib/ holds metadata-only copies of everything the project references, so a build server
      # needs no Valheim install and no download step. See tools/strip-references.ps1.
      - name: Build
        run: dotnet build -c Release -p:LibsDir=lib --nologo

      # The tests cover the part of Scry that needs no game. Those that time the search against
      # a frame's budget (SearchLoadTests) are left to local runs, since a shared runner's speed
      # varies too much for a fixed budget to mean anything.
      - name: Test
        run: dotnet test tests/Scry.Tests --nologo --filter "FullyQualifiedName!~SearchLoadTests"

      - uses: actions/upload-artifact@v4
        with:
          name: Scry
          path: bin/Release/Scry.dll
          if-no-files-found: error
